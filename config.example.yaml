# ──────────────────────────────────────────────────────────────────────────────
# BruteForce Detector — konfiguracja
# ──────────────────────────────────────────────────────────────────────────────

detection:
  threshold: 5                 # number of failed logins triggering an alert
  time_window: 60              # time window (seconds)
  alert_cooldown: 300          # cooldown between alerts for the same IP (seconds)
  success_failure_threshold: 3 # min failures before a success counts as a breach
  spray_username_threshold: 8  # unique accounts from one IP = password spray alert
  slow_threshold: 10           # low-and-slow: failures within slow_window that trigger an alert (0 = off)
  slow_window: 3600            # long window (seconds) for slow_threshold
  action_on_threat_intel_match: block  # block / alert_only — overrides blocker for TI-matched IPs

log_files:
  - path: /var/log/auth.log    # Debian / Ubuntu
    type: linux_ssh
    enabled: true

  # - path: /var/log/secure    # RHEL / CentOS / Fedora
  #   type: linux_ssh
  #   enabled: true

  # - path: /sciezka/do/Security.evtx   # plik Windows Event Log
  #   type: windows_evtx
  #   enabled: false

  # Other services — parsers: nginx | apache | ftp | mysql
  # - path: /var/log/nginx/access.log     # Basic auth + login panels (wp-login.php, /login, ...)
  #   type: nginx
  #   enabled: true
  # - path: /var/log/apache2/error.log    # Apache Basic auth failures (use type: apache)
  #   type: apache
  #   enabled: true
  # - path: /var/log/vsftpd.log           # vsftpd / proftpd / pure-ftpd
  #   type: ftp
  #   enabled: true
  # - path: /var/log/mysql/error.log      # MySQL/MariaDB "Access denied" (see README)
  #   type: mysql
  #   enabled: true

discord:
  enabled: false
  webhook_url: ""   # https://discord.com/api/webhooks/ID/TOKEN

slack:
  enabled: false
  webhook_url: ""   # https://hooks.slack.com/services/T.../B.../...

# ── Central Syslog receiver ───────────────────────────────────────────────────
# Collects auth logs from remote machines (SSH, xRDP) over the network.
# Remote servers forward via rsyslog / syslog-ng — no agent needed.
#
# rsyslog snippet (on each remote machine):
#   *.auth    @brutus-server:5514      # UDP (one @)
#   *.auth    @@brutus-server:5514     # TCP (two @@)
#
# Note: port 514 requires root or CAP_NET_BIND_SERVICE.
#       Port 5514 works without root privileges.
syslog:
  enabled: false
  host: "0.0.0.0"      # bind address; use "127.0.0.1" for local-only
  port: 5514
  protocol: udp          # udp | tcp
  parser: linux_ssh      # parser for incoming messages

# ── systemd journal ───────────────────────────────────────────────────────────
# For systems that log SSH only to the journal (no /var/log/auth.log).
# Needs read access to the journal: run as root or add the user to the
# 'systemd-journal' group.
journald:
  enabled: false
  units: [ssh, sshd, xrdp-sesman]   # systemd units to follow
  parser: linux_ssh

geo:
  enabled: true
  cache_ttl: 3600
  timeout: 5
  # Offline lookups: run `python3 main.py --geoip-download` (free DB-IP database -> data/geoip.mmdb,
  # picked up automatically). Or point to your own GeoLite2/DB-IP file:
  # mmdb_path: /path/to/GeoLite2-City.mmdb
  online_fallback: true        # false = never query ip-api.com (plain HTTP); offline database only

blocker:
  enabled: false              # requires root / sudo
  auto_unblock_after: 3600    # seconds; 0 = permanent until restart
  state_file: reports/blocked_ips.json
  dry_run: false              # true = log only, no real iptables rules
  scope: all                  # all = drop every packet from the IP; service = only the attacked service's ports
  # ports used when scope: service (attack type -> TCP ports; PASSWORD_SPRAY / unknown = full block)
  # ports: {SSH: [22], RDP: [3389], HTTP: [80, 443], FTP: [21], MYSQL: [3306]}
  trusted_proxies: []         # never blocked, e.g. your reverse proxy / CDN: ["10.0.0.5", "172.16.0.0/12"]
  protect_private: false      # true = never block private ranges (10/8, 172.16/12, 192.168/16, fc00::/7)
  # Always protected: loopback, link-local, multicast and this host's own addresses

state:
  enabled: true                          # keep counters/cooldowns across restarts
  path: reports/tracker_state.json
  save_interval: 30                      # seconds
  catch_up: true                         # after a restart, process log lines written while BRUTU$ was down
  catch_up_max_mb: 64                    # max backlog per file; older part is skipped

whitelist:
  - "127.0.0.1"
  - "::1"
  # - "192.168.1.0/24"

reports:
  save_to_file: true
  output_path: reports/alerts.jsonl

logging:
  level: INFO
  stats_interval: 300          # seconds between "Active IPs" summary lines (only when changed; 0 = off)
  # file: logs/detector.log

# ── Offline IP reputation / Threat Intelligence ──────────────────────────────
# Free public blocklists — no API key, no account required.
# Step 1: python main.py --update-threat-db   (downloads ~50k bad IPs/CIDRs)
# Step 2: set enabled: true
threat_intel:
  enabled: false
  db_path: reports/threat_intel.txt
  auto_update: false            # refresh DB automatically every update_interval
  update_interval: 86400        # seconds between auto-updates (default: 24 h)
  timeout: 15                   # HTTP request timeout per source (seconds)
  sources:                    # leave empty to use all 6 built-in sources; swap URLs as needed
    - "https://www.spamhaus.org/drop/drop.txt"
    - "https://www.spamhaus.org/drop/edrop.txt"
    - "https://iplists.firehol.org/files/firehol_level1.netset"
    - "https://lists.blocklist.de/lists/ssh.txt"
    - "https://cinsscore.com/list/ci-badguys.txt"
    - "https://rules.emergingthreats.net/fwrules/emerging-Block-IPs.txt"
    - "https://feodotracker.abuse.ch/downloads/ipblocklist_recommended.txt"
